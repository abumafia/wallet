<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - H-Coin Wallet</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Skeleton CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.24/skeleton.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0c1445 0%, #1a237e 50%, #0f172a 100%);
            min-height: 100vh;
        }
        
        .deposit-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.03)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.03)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>') repeat;
            z-index: -1;
            animation: subtleFloat 20s ease-in-out infinite;
        }
        
        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        
        .navbar {
            background: rgba(12, 20, 69, 0.9) !important;
            backdrop-filter: blur(20px);
        }
        
        .card {
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.98);
        }
        
        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            padding: 0.875rem;
            transition: all 0.3s ease;
            background: #f8fafc;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
            background: white;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none;
            border-radius: 10px;
            padding: 0.875rem;
            font-weight: 500;
            width: 100%;
            color: white;
        }
        
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 15px rgba(59, 130, 246, 0.3);
            color: white;
        }
        
        .payment-details {
            background: #f1f5f9;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }
        
        .payment-details strong {
            color: #1e293b;
        }
        
        @media (max-width: 768px) {
            .card {
                margin: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="deposit-bg"></div>
    
    <!-- Navigation -->
    <nav class="navbar navbar-dark fixed-top px-3">
        <div class="container-fluid">
            <a href="index.html" class="btn btn-outline-light">
                <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
            </a>
        </div>
    </nav>
    
    <div class="container py-4 mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card animate__animated animate__fadeInUp">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h2 class="text-primary mb-2">
                                <i class="fas fa-plus-circle me-2"></i>Deposit UZS
                            </h2>
                            <p class="text-muted">Select a payment method to deposit and convert to H-Coin.</p>
                        </div>
                        
                        <form id="deposit-form" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="deposit-amount" class="form-label fw-medium">
                                    <i class="fas fa-money-bill me-2 text-success"></i>Amount (UZS)
                                </label>
                                <input type="number" class="form-control" id="deposit-amount" min="5000" required>
                                <div class="form-text">Minimum 5,000 UZS</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="payment-method" class="form-label fw-medium">
                                    <i class="fas fa-credit-card me-2 text-primary"></i>Payment Method
                                </label>
                                <select class="form-select" id="payment-method" required>
                                    <option value="">Select Method</option>
                                    <option value="payeer">Payeer</option>
                                    <option value="paypal">PayPal</option>
                                    <option value="btc">Bitcoin (BTC)</option>
                                    <option value="eth">Ethereum (ETH)</option>
                                    <option value="usdt">USDT (TRC20)</option>
                                    <option value="uzcard">UzCard</option>
                                </select>
                                <div id="payment-details" class="payment-details hidden">
                                    <p><strong>Pay to:</strong> <span id="details-content"></span></p>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="external-details" class="form-label fw-medium">
                                    <i class="fas fa-info-circle me-2 text-info"></i>Transaction Note/ID
                                </label>
                                <input type="text" class="form-control" id="external-details" placeholder="Include your wallet number" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="screenshot" class="form-label fw-medium">
                                    <i class="fas fa-image me-2 text-warning"></i>Payment Screenshot
                                </label>
                                <input type="file" class="form-control" id="screenshot" accept="image/*" required>
                                <div class="form-text">Upload proof of payment</div>
                            </div>
                            
                            <button type="submit" class="btn btn-submit">
                                <i class="fas fa-paper-plane me-2"></i>Submit Deposit
                            </button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <a href="index.html" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Notification -->
    <div id="notification" class="notification"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Load payment details on method change
        document.getElementById('payment-method').addEventListener('change', async (e) => {
            const method = e.target.value;
            const detailsDiv = document.getElementById('payment-details');
            if (method) {
                try {
                    const response = await fetch(`/api/admin/payment/${method}`);
                    if (response.ok) {
                        const data = await response.json();
                        document.getElementById('details-content').textContent = JSON.stringify(data.details).replace(/"/g, '').replace(/,/g, ', ').replace(/:/g, ': ');
                        detailsDiv.classList.remove('hidden');
                    } else {
                        detailsDiv.classList.add('hidden');
                    }
                } catch (error) {
                    console.error('Failed to load details:', error);
                    detailsDiv.classList.add('hidden');
                }
            } else {
                detailsDiv.classList.add('hidden');
            }
        });
        
        // Form submission
        document.getElementById('deposit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const response = await fetch('/api/deposit', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.success) {
                    showNotification('Deposit submitted for verification!');
                    setTimeout(() => window.location.href = 'index.html', 2000);
                } else {
                    showNotification(data.error || 'Submission failed', 'error');
                }
            } catch (error) {
                showNotification('Network error', 'error');
            }
        });
        
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
