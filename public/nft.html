<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFT Marketplace - H-Coin Wallet</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Skeleton CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.24/skeleton.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0c1445 0%, #1a237e 50%, #0f172a 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #333;
        }
        
        .nft-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.03)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.03)"/><circle cx="50" cy="10" r="0.5" fill="rgba(255,255,255,0.02)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>') repeat;
            z-index: -1;
            animation: subtleFloat 20s ease-in-out infinite;
        }
        
        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        
        .navbar {
            background: rgba(12, 20, 69, 0.9) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .nav-link {
            color: #e2e8f0 !important;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .nav-link:hover {
            color: #a0aec0 !important;
            transform: translateY(-1px);
        }
        
        .nav-link.active {
            color: #60a5fa !important;
            border-bottom: 2px solid #60a5fa;
        }
        
        .navbar-brand {
            color: #f1f5f9 !important;
            font-weight: 600;
        }
        
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.98);
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }
        
        .nft-card-img {
            height: 200px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .card:hover .nft-card-img {
            transform: scale(1.05);
        }
        
        .btn-nft {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border: none;
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-nft:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
            color: white;
        }
        
        .btn-list {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            color: white;
        }
        
        .btn-list:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(245, 158, 11, 0.4);
            color: white;
        }
        
        .rarity-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .rarity-common { background: #d1d5db; color: #374151; }
        .rarity-rare { background: #3b82f6; color: white; }
        .rarity-epic { background: #8b5cf6; color: white; }
        .rarity-legendary { background: #ec4899; color: white; }
        
        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }
        
        .shape:nth-child(1) { width: 60px; height: 60px; top: 20%; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 40px; height: 40px; top: 60%; right: 20%; animation-delay: 3s; }
        .shape:nth-child(3) { width: 80px; height: 80px; bottom: 20%; left: 20%; animation-delay: 5s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(90deg); }
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.success { background: #10b981; }
        .notification.error { background: #ef4444; }
        
        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .navbar-nav {
                background: rgba(12, 20, 69, 0.95);
                backdrop-filter: blur(20px);
                border-radius: 8px;
                margin-top: 0.5rem;
            }
            
            .card {
                margin-bottom: 0.75rem;
            }
            
            body {
                padding-top: 1.5rem;
            }
        }
        
        .text-white-soft {
            color: #f1f5f9;
        }
        
        .header-text {
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="nft-bg"></div>
    
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top px-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold fs-4" href="index.html">
                <i class="fas fa-gem me-2"></i>H-Coin NFT
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="fas fa-tachometer-alt me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="trade.html"><i class="fas fa-exchange-alt me-1"></i>Trade</a></li>
                    <li class="nav-item"><a class="nav-link active" href="nft.html"><i class="fas fa-gem me-1"></i>NFT</a></li>
                    <li class="nav-item"><a class="nav-link" href="history.html"><i class="fas fa-history me-1"></i>History</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="fas fa-user me-1"></i>Profile</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="register-login.html" id="logout-btn"><i class="fas fa-sign-out-alt me-1"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <div class="container py-4 mt-5">
        <!-- Header -->
        <div class="text-center mb-4 animate__animated animate__fadeInDown">
            <h1 class="display-5 fw-bold header-text mb-3">
                <i class="fas fa-gem me-2"></i>NFT Marketplace
            </h1>
            <p class="lead text-white-soft">Discover, buy, sell unique digital assets with H-Coin. Create & list your NFTs today.</p>
        </div>
        
        <!-- Filters -->
        <div class="card mb-4 animate__animated animate__fadeInUp">
            <div class="card-body p-4">
                <div class="row g-3">
                    <div class="col-md-3">
                        <input type="text" class="form-control" id="search-input" placeholder="Search NFTs...">
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="category-filter">
                            <option value="">All Categories</option>
                            <option value="art">Art</option>
                            <option value="collectible">Collectible</option>
                            <option value="gaming">Gaming</option>
                            <option value="music">Music</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="rarity-filter">
                            <option value="">All Rarities</option>
                            <option value="common">Common</option>
                            <option value="rare">Rare</option>
                            <option value="epic">Epic</option>
                            <option value="legendary">Legendary</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <select class="form-select" id="sort-filter">
                            <option value="newest">Sort: Newest</option>
                            <option value="price_asc">Price Low-High</option>
                            <option value="price_desc">Price High-Low</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button id="filter-btn" class="btn btn-primary w-100">Filter & Sort</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row g-4">
            <!-- Marketplace -->
            <div class="col-lg-8">
                <div class="card animate__animated animate__fadeInLeft">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0"><i class="fas fa-store me-2 text-primary"></i>Marketplace</h5>
                            <button class="btn btn-outline-primary btn-sm" id="refresh-marketplace">
                                <i class="fas fa-sync-alt"></i> Refresh
                            </button>
                        </div>
                        <div id="marketplace-grid" class="row g-3">
                            <!-- NFTs loaded here -->
                        </div>
                        <div id="marketplace-pagination" class="d-flex justify-content-center mt-3"></div>
                    </div>
                </div>
            </div>
            
            <!-- My NFTs -->
            <div class="col-lg-4">
                <div class="card animate__animated animate__fadeInRight mb-4">
                    <div class="card-body p-4">
                        <h5 class="card-title mb-3"><i class="fas fa-images me-2 text-info"></i>My NFTs</h5>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="mb-0">Collection Value: <span id="collection-value" class="text-success fw-bold">0</span> H-Coin</h6>
                            <button class="btn btn-outline-info btn-sm" id="refresh-mynfts">
                                <i class="fas fa-sync-alt"></i>
                            </button>
                        </div>
                        <button class="btn btn-success w-100 mb-3" data-bs-toggle="modal" data-bs-target="#createNFTModal">
                            <i class="fas fa-plus me-2"></i>Create NFT (5 H-Coin)
                        </button>
                        <div id="my-nfts-list" class="list-group">
                            <!-- Own NFTs loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Create NFT Modal -->
    <div class="modal fade" id="createNFTModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-gem me-2"></i>Create New NFT</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="create-nft-form" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="nft-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="nft-description" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="nft-category">
                                <option value="art">Art</option>
                                <option value="collectible">Collectible</option>
                                <option value="gaming">Gaming</option>
                                <option value="music">Music</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rarity</label>
                            <select class="form-select" id="nft-rarity">
                                <option value="common">Common</option>
                                <option value="rare">Rare</option>
                                <option value="epic">Epic</option>
                                <option value="legendary">Legendary</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image/Video</label>
                            <input type="file" class="form-control" id="nft-image" accept="image/*,video/*" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="submit-create-nft" class="btn btn-success">Create</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Buy NFT Modal -->
    <div class="modal fade" id="buyNFTModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="buy-title">Buy NFT</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="buy-details">
                    <!-- Dynamic content -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirm-buy" class="btn btn-success">Buy Now</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- List NFT Modal -->
    <div class="modal fade" id="listNFTModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-tag me-2"></i>List for Sale</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="list-nft-form">
                        <input type="hidden" id="list-nft-id">
                        <div class="mb-3">
                            <label class="form-label">NFT Name</label>
                            <p id="list-nft-name" class="fw-medium"></p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price (H-Coin)</label>
                            <input type="number" class="form-control" id="list-price" step="0.01" min="0.01" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="submit-list" class="btn btn-warning">List NFT</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Notification -->
    <div id="notification" class="notification"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let currentUser = null;
        let currentPage = 1;
        let totalPages = 1;
        let currentListingId = null;
        let myNFTs = [];
        
        // Auth check
        async function checkAuth() {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    currentUser = await response.json();
                    loadMarketplace();
                    loadMyNFTs();
                } else {
                    window.location.href = 'register-login.html';
                }
            } catch (error) {
                console.error('Auth failed:', error);
                window.location.href = 'register-login.html';
            }
        }
        
        // Load marketplace
        async function loadMarketplace(page = 1) {
            const search = document.getElementById('search-input').value;
            const category = document.getElementById('category-filter').value;
            const rarity = document.getElementById('rarity-filter').value;
            const sort = document.getElementById('sort-filter').value;
            const params = new URLSearchParams({ page, limit: 12, search, category, rarity, sort });
            
            try {
                const response = await fetch(`/api/nft/marketplace?${params}`);
                if (response.ok) {
                    const data = await response.json();
                    displayMarketplaceNFTs(data.listings);
                    updatePagination(data.pages, page);
                    currentPage = page;
                } else {
                    showNotification('Failed to load marketplace', 'error');
                }
            } catch (error) {
                console.error('Load marketplace error:', error);
                showNotification('Network error', 'error');
            }
        }
        
        // Display marketplace NFTs
        function displayMarketplaceNFTs(listings) {
            const container = document.getElementById('marketplace-grid');
            if (listings.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fas fa-gem fa-3x text-muted mb-3"></i>
                        <p class="text-muted">No NFTs available in marketplace</p>
                    </div>
                `;
                return;
            }
            container.innerHTML = listings.map(listing => {
                const nft = listing.nft;
                const rarityClass = `rarity-${nft.rarity}`;
                const mediaTag = nft.image.endsWith('.mp4') || nft.image.includes('video') ? 'video' : 'img';
                const mediaAttr = nft.image.endsWith('.mp4') || nft.image.includes('video') ? 'controls' : `alt="${nft.name}"`;
                return `
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card h-100">
                            <div class="position-relative overflow-hidden">
                                <${mediaTag} src="${nft.image}" class="card-img-top nft-card-img" ${mediaAttr}>
                            </div>
                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title fw-bold">${nft.name}</h6>
                                <p class="card-text flex-grow-1 small text-muted">${nft.description.substring(0, 100)}${nft.description.length > 100 ? '...' : ''}</p>
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="rarity-badge ${rarityClass}">${nft.rarity.toUpperCase()}</span>
                                    <small class="text-muted">${nft.category}</small>
                                </div>
                                <p class="text-muted small mb-1">Creator: ${nft.creator.username}</p>
                                <p class="text-muted small mb-2">Seller: ${listing.seller.username}</p>
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <span class="h5 fw-bold text-success">${listing.price} H-Coin</span>
                                </div>
                                <button class="btn btn-nft w-100 mt-auto" onclick="showBuyModal('${listing._id}')">
                                    <i class="fas fa-shopping-cart me-1"></i>Buy Now
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Load my NFTs
        async function loadMyNFTs() {
            try {
                const response = await fetch('/api/nft/user/me');
                if (response.ok) {
                    myNFTs = await response.json();
                    displayMyNFTs(myNFTs);
                }
            } catch (error) {
                console.error('Load my NFTs error:', error);
            }
        }
        
        // Display my NFTs
        function displayMyNFTs(nfts) {
            const container = document.getElementById('my-nfts-list');
            if (nfts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-3 text-muted">
                        <i class="fas fa-images fa-2x mb-2"></i>
                        <p class="small">No NFTs owned</p>
                    </div>
                `;
                updateCollectionValue(0);
                return;
            }
            container.innerHTML = nfts.map(nft => {
                const isListed = !!nft.activeListing;
                const rarityClass = `rarity-${nft.rarity}`;
                const mediaTag = nft.image.endsWith('.mp4') || nft.image.includes('video') ? 'video' : 'img';
                const mediaAttr = nft.image.endsWith('.mp4') || nft.image.includes('video') ? 'controls' : `alt="${nft.name}"`;
                const priceDisplay = isListed ? `<small class="text-success d-block">Listed: ${nft.activeListing.price} H-Coin</small>` : '';
                return `
                    <div class="list-group-item border-0 p-2 mb-2 rounded">
                        <div class="row align-items-center">
                            <div class="col-4">
                                <${mediaTag} src="${nft.image}" class="img-fluid rounded" style="height: 80px; object-fit: cover;" ${mediaAttr}>
                            </div>
                            <div class="col-8">
                                <h6 class="mb-1">${nft.name}</h6>
                                <p class="small text-muted mb-1">${nft.description.substring(0, 50)}...</p>
                                <span class="rarity-badge ${rarityClass} me-2">${nft.rarity.toUpperCase()}</span>
                                <span class="small text-muted">${nft.category}</span>
                                <small class="d-block text-muted">Creator: ${nft.creator.username}</small>
                                ${priceDisplay}
                                ${isListed ? `
                                    <button class="btn btn-sm btn-outline-danger mt-1 w-100" onclick="unlistNFT('${nft.activeListing._id}')">
                                        <i class="fas fa-times me-1"></i>Unlist
                                    </button>
                                ` : `
                                    <button class="btn btn-sm btn-list mt-1 w-100" onclick="showListModal('${nft._id}', '${nft.name}')">
                                        <i class="fas fa-tag me-1"></i>List for Sale
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            updateCollectionValue(nfts);
        }
        
        function updateCollectionValue(nfts) {
            const total = nfts.reduce((sum, nft) => sum + (nft.activeListing ? nft.activeListing.price : 0), 0);
            document.getElementById('collection-value').textContent = total.toFixed(2);
        }
        
        // Update pagination
        function updatePagination(pages, current) {
            const container = document.getElementById('marketplace-pagination');
            if (pages <= 1) {
                container.innerHTML = '';
                return;
            }
            let html = '<nav><ul class="pagination">';
            for (let i = 1; i <= pages; i++) {
                html += `<li class="page-item ${i === current ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="loadMarketplace(${i}); return false;">${i}</a>
                </li>`;
            }
            html += '</ul></nav>';
            container.innerHTML = html;
        }
        
        // Show buy modal
        async function showBuyModal(listingId) {
            try {
                const response = await fetch(`/api/nft/listing/${listingId}`);
                if (response.ok) {
                    const listing = await response.json();
                    currentListingId = listing._id;
                    document.getElementById('buy-title').textContent = `Buy ${listing.nft.name}`;
                    document.getElementById('buy-details').innerHTML = `
                        <img src="${listing.nft.image}" class="img-fluid rounded mb-3" style="height: 200px; object-fit: cover;">
                        <h6 class="fw-bold">${listing.nft.name}</h6>
                        <p class="text-muted small">${listing.nft.description}</p>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="small text-muted">Creator: ${listing.nft.creator.username}</span>
                            <span class="small text-muted">Seller: ${listing.seller.username}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="h5 fw-bold text-success">${listing.price} H-Coin</span>
                            <small class="text-muted">+5% fee</small>
                        </div>
                    `;
                    new bootstrap.Modal(document.getElementById('buyNFTModal')).show();
                }
            } catch (error) {
                showNotification('Failed to load NFT details', 'error');
            }
        }
        
        // Confirm buy
        document.getElementById('confirm-buy').addEventListener('click', async () => {
            if (!currentListingId) return;
            try {
                const response = await fetch(`/api/nft/buy/${currentListingId}`, { method: 'POST' });
                const data = await response.json();
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('buyNFTModal')).hide();
                    loadMarketplace(currentPage);
                    loadMyNFTs();
                    showNotification('NFT purchased successfully!');
                } else {
                    showNotification(data.error || 'Purchase failed', 'error');
                }
            } catch (error) {
                showNotification('Network error', 'error');
            }
        });
        
        // Show list modal
        function showListModal(nftId, name) {
            document.getElementById('list-nft-id').value = nftId;
            document.getElementById('list-nft-name').textContent = name;
            new bootstrap.Modal(document.getElementById('listNFTModal')).show();
        }
        
        // Submit list
        document.getElementById('submit-list').addEventListener('click', async () => {
            const nftId = document.getElementById('list-nft-id').value;
            const price = parseFloat(document.getElementById('list-price').value);
            if (!price || price <= 0) {
                showNotification('Invalid price', 'error');
                return;
            }
            try {
                const response = await fetch(`/api/nft/list/${nftId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ price })
                });
                const data = await response.json();
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('listNFTModal')).hide();
                    loadMyNFTs();
                    showNotification('NFT listed successfully!');
                } else {
                    showNotification(data.error || 'Listing failed', 'error');
                }
            } catch (error) {
                showNotification('Network error', 'error');
            }
        });
        
        // Unlist NFT
        async function unlistNFT(listingId) {
            if (confirm('Unlist this NFT?')) {
                try {
                    const response = await fetch(`/api/nft/list/${listingId}`, { method: 'DELETE' });
                    if (response.ok) {
                        loadMyNFTs();
                        showNotification('NFT unlisted successfully');
                    } else {
                        const data = await response.json();
                        showNotification(data.error || 'Failed to unlist', 'error');
                    }
                } catch (error) {
                    showNotification('Network error', 'error');
                }
            }
        }
        
        // Create NFT
        document.getElementById('submit-create-nft').addEventListener('click', async () => {
            const formData = new FormData();
            formData.append('name', document.getElementById('nft-name').value.trim());
            formData.append('description', document.getElementById('nft-description').value.trim());
            formData.append('category', document.getElementById('nft-category').value);
            formData.append('rarity', document.getElementById('nft-rarity').value);
            const imageFile = document.getElementById('nft-image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }
            
            if (!formData.get('name') || !formData.get('description') || !imageFile) {
                showNotification('Please fill all required fields (name, description, and image/video).', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/nft/create', { 
                    method: 'POST', 
                    body: formData 
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('createNFTModal')).hide();
                    document.getElementById('create-nft-form').reset();
                    loadMyNFTs();
                    showNotification('NFT creation submitted for approval!');
                } else {
                    showNotification(data.error || 'Creation failed', 'error');
                }
            } catch (error) {
                console.error('Create NFT error:', error);
                showNotification('Network error: ' + error.message, 'error');
            }
        });
        
        // Filter button
        document.getElementById('filter-btn').addEventListener('click', () => loadMarketplace(1));
        
        // Refresh marketplace
        document.getElementById('refresh-marketplace').addEventListener('click', () => loadMarketplace(1));
        
        // Refresh my NFTs
        document.getElementById('refresh-mynfts').addEventListener('click', () => loadMyNFTs());
        
        // Search input
        document.getElementById('search-input').addEventListener('input', () => setTimeout(() => loadMarketplace(1), 500));
        document.getElementById('category-filter').addEventListener('change', () => loadMarketplace(1));
        document.getElementById('rarity-filter').addEventListener('change', () => loadMarketplace(1));
        document.getElementById('sort-filter').addEventListener('change', () => loadMarketplace(1));
        
        // Logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = 'register-login.html';
        });
        
        // Notification
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 4000);
        }
        
        // Init
        checkAuth();
        setInterval(() => {
            loadMarketplace(currentPage);
            loadMyNFTs();
        }, 30000);
    </script>
</body>
</html>
